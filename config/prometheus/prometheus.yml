global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'sla-monitor'
    static_configs:
      - targets: ['sla-monitor:8002']
    metrics_path: '/metrics'
  
  - job_name: 'simulation-sandbox'
    static_configs:
      - targets: ['simulation-sandbox:8003']
    metrics_path: '/metrics'
  
  - job_name: 'data-simulator'
    static_configs:
      - targets: ['data-simulator:8001']
    metrics_path: '/metrics'
  
  - job_name: 'inference'
    static_configs:
      - targets: ['inference:8004']
    metrics_path: '/metrics'
